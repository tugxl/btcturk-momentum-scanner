name: BtcTurk Momentum Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get scanner code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Restore scanner history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: btcturk-scanner-history-${{ github.run_id }}
          restore-keys: |
            btcturk-scanner-history-

      - name: Run BtcTurk scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_scan.py

      - name: Save scanner history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: btcturk-scanner-history-${{ github.run_id }}
